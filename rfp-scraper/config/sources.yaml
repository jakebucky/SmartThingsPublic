# Where to look for RFPs.
#
# Every source has:
#   name         - shown in the dashboard
#   agency       - the public body that issues the solicitations
#   agency_type  - State | City | County | School District | Technical College |
#                  Utility | Federal  (used by the dashboard's agency-type filter)
#   type         - html | bonfire | sam_gov
#   enabled      - set false to skip it
#
# type: html  (any public "Bids / RFPs" web page)
#   url             - the listing page
#   item_selector   - optional CSS selector for one listing (e.g. "table.bids tr").
#                     Leave it out and the scraper auto-detects listings by looking
#                     for links whose surrounding text mentions RFP/RFQ/bid/etc.
#   title_selector  - optional CSS selector (inside an item) for the title
#   fetch_details   - true to also open each listing's own page and read its text
#                     (better keyword matching, slower)
#
# type: bonfire  (agencies that post on <org>.bonfirehub.com)
#   org             - the subdomain, e.g. "cityofmadison"
#
# type: sam_gov  (federal opportunities in Wisconsin, via the official API)
#   needs a free API key from sam.gov in the SAM_API_KEY environment variable;
#   the source is skipped when the key is missing.
#   naics           - NAICS codes to search
#   state           - place-of-performance state
#   days_back       - how far back to look for postings
#
# type: email_alerts  (bid-alert emails, e.g. from DemandStar)
#   mode: imap      - read a mailbox: host, folder, from_filter, days_back;
#                     login from env vars RFP_IMAP_USER / RFP_IMAP_PASSWORD
#   mode: folder    - read saved .eml/.html/.txt files from `path`
#   Each bid's agency is read from the email, so agency_type is optional here.
#
# NOTE: bid pages move often. After a run, check the Sources tab in the
# dashboard: any source showing an error or 0 listings needs its URL (or an
# item_selector) updated. Entries marked "verify" are best guesses; the rest
# were confirmed against the agency's own site in November 2026.

sources:
  # ---------------------------------------------------------------- State
  - name: Wisconsin VendorNet (State)
    agency: State of Wisconsin
    agency_type: State
    type: html
    url: https://vendornet.wi.gov/Bids.aspx  # verify
    enabled: true

  - name: WisDOT Engineering Consultant Selection
    agency: Wisconsin Department of Transportation
    agency_type: State
    type: html
    url: https://wisconsindot.gov/Pages/doing-bus/eng-consultants/cnslt-rsrces/selection/default.aspx  # verify
    enabled: true

  - name: WI DOA Division of Facilities Development
    agency: Wisconsin Department of Administration
    agency_type: State
    type: html
    url: https://doa.wi.gov/Pages/DoingBusiness/DFD-Consultant-Selection.aspx  # verify
    enabled: true

  # ---------------------------------------------------------------- Cities & utilities
  - name: City of Milwaukee DPW Bids & Contracts
    agency: City of Milwaukee
    agency_type: City
    type: html
    url: https://city.milwaukee.gov/dpw/infrastructure/Bids-and-Contracts  # verify
    enabled: true

  - name: City of Milwaukee Purchasing
    agency: City of Milwaukee
    agency_type: City
    type: html
    url: https://city.milwaukee.gov/Purchasing  # verify
    enabled: true

  - name: City of Madison (Bonfire)
    agency: City of Madison
    agency_type: City
    type: bonfire
    org: cityofmadison  # verify
    enabled: true

  - name: MMSD Bid Opportunities
    agency: Milwaukee Metropolitan Sewerage District
    agency_type: Utility
    type: html
    url: https://www.mmsd.com/doing-business/bid-opportunities  # verify
    enabled: true

  # ---------------------------------------------------------------- Counties
  - name: Milwaukee County Procurement
    agency: Milwaukee County
    agency_type: County
    type: html
    url: https://county.milwaukee.gov/EN/Administrative-Services/Procurement  # verify
    enabled: true

  - name: Waukesha County Purchasing
    agency: Waukesha County
    agency_type: County
    type: html
    url: https://www.waukeshacounty.gov/administration/purchasing/  # verify
    enabled: true

  - name: Dane County Public Works
    agency: Dane County
    agency_type: County
    type: html
    # Engineering/A-E RFPs for Dane County run through Public Works, not Purchasing.
    url: https://publicworks.danecounty.gov/  # verify (domain confirmed)
    fetch_details: true
    enabled: true

  - name: Dane County Purchasing
    agency: Dane County
    agency_type: County
    type: html
    url: https://www.danepurchasing.com/  # verify (domain confirmed)
    enabled: true

  - name: Racine County Purchasing
    agency: Racine County
    agency_type: County
    type: html
    url: https://www.racinecounty.gov/departments/finance/purchasing-rfps-and-bids
    enabled: true

  - name: Ozaukee County Bids
    agency: Ozaukee County
    agency_type: County
    type: html
    url: https://ozaukeecounty.gov/bids.aspx
    enabled: true

  - name: Washington County Purchasing
    agency: Washington County
    agency_type: County
    type: html
    url: https://www.washcowisco.gov/departments/purchasing
    enabled: true

  - name: Brown County Purchasing
    agency: Brown County
    agency_type: County
    type: html
    # Formal solicitations are also on DemandStar; this page links bid PDFs.
    url: https://www.browncountywi.gov/departments/administration/general-information/purchasing/
    enabled: true

  - name: Outagamie County Bids & Proposals
    agency: Outagamie County
    agency_type: County
    type: html
    url: https://www.outagamie.gov/County-FinancialsBids-Proposals/Bids-Proposals  # verify (listing pages live under this path)
    enabled: true

  - name: Marathon County RFPs & Bids
    agency: Marathon County
    agency_type: County
    type: html
    url: https://www.marathoncounty.gov/about-us/rfps-bids
    enabled: true

  - name: Eau Claire County Bids & Proposals
    agency: Eau Claire County
    agency_type: County
    type: html
    # Links out to DemandStar for most solicitations.
    url: https://eauclairecounty.gov/our-government/departments-and-facilities/department-directory/finance/purchasing/bids-and-proposals
    enabled: true

  # ---------------------------------------------------------------- School districts
  - name: Milwaukee Public Schools Procurement
    agency: Milwaukee Public Schools
    agency_type: School District
    type: html
    url: https://mps.milwaukee.k12.wi.us/en/District/About-MPS/Departments/Office-of-Finance/Procurement-Services.htm  # verify
    enabled: true

  - name: Madison Metropolitan SD Bids & Proposals
    agency: Madison Metropolitan School District
    agency_type: School District
    type: html
    url: https://www.madison.k12.wi.us/purchasing/requests-for-bidsproposals
    enabled: true

  - name: Madison Metropolitan SD Operations RFPs
    agency: Madison Metropolitan School District
    agency_type: School District
    type: html
    url: https://operations.madison.k12.wi.us/rfp
    enabled: true

  - name: Kenosha Unified SD Requests for Proposals
    agency: Kenosha Unified School District
    agency_type: School District
    type: html
    url: https://www.kusd.edu/district/departments/finance/request-proposals/
    enabled: true

  - name: Appleton Area SD RFPs & Bids
    agency: Appleton Area School District
    agency_type: School District
    type: html
    url: https://www.aasd.k12.wi.us/district/district-information/technology-services/requests-for-proposals-bids
    enabled: true

  - name: Milton SD Requests for Proposals
    agency: School District of Milton
    agency_type: School District
    type: html
    url: https://www.milton.k12.wi.us/district/district-information/request-for-proposals/
    enabled: true

  # ---------------------------------------------------------------- Technical colleges
  - name: Madison College Purchasing
    agency: Madison Area Technical College
    agency_type: Technical College
    type: html
    url: https://madisoncollege.edu/purchasing
    enabled: true

  # ---------------------------------------------------------------- Federal
  - name: SAM.gov (Federal, Wisconsin)
    agency: U.S. Federal Government
    agency_type: Federal
    type: sam_gov
    state: WI
    days_back: 30
    naics:
      - "541330"  # Engineering Services
      - "541320"  # Landscape Architectural Services
      - "541370"  # Surveying and Mapping Services
      - "541310"  # Architectural Services
    enabled: true

  # ---------------------------------------------------------------- DemandStar alerts
  # Many WI agencies post only on DemandStar (Euna OpenBids), including
  #   Counties: Rock, La Crosse, Walworth, Kenosha, Sheboygan, Racine, Brown, Eau Claire
  #   Schools:  Racine Unified, Green Bay Area, Oshkosh Area, Eau Claire Area,
  #             Waukesha, Elmbrook, Sun Prairie, Verona, Middleton-Cross Plains,
  #             Janesville, West Allis-West Milwaukee
  #   Colleges: MATC, Madison College
  # DemandStar has no public API and restricts automated access, so instead of
  # scraping it we read the alert emails it sends to a registered vendor.
  # See README "DemandStar" for setup. Both sources are skipped until set up.
  - name: DemandStar Alerts (mailbox)
    agency: DemandStar
    type: email_alerts
    mode: imap
    host: imap.gmail.com        # or outlook.office365.com, etc.
    folder: INBOX               # tip: filter alerts into their own folder
    from_filter: demandstar
    days_back: 30
    enabled: true

  - name: DemandStar Alerts (saved emails)
    agency: DemandStar
    type: email_alerts
    mode: folder
    path: data/alerts           # drop .eml files here (Outlook: File > Save As)
    enabled: true

# Not covered yet: Winnebago County posts on OpenGov Procurement.
